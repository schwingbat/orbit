<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Orbit: HUEHUEHUE!</title>

  <link rel="icon" type="images/png" href="/icons/logo.png" />
  <link rel="manifest" href="/manifest.json" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Orbit" />
  <link rel="apple-touch-startup-image" href="/icons/logo.png" />
  <link rel="apple-touch-icon" href="/icons/512.png" />

  <style>
    *,
    *:before,
    *:after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto",
        "Oxygen", "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans",
        "Helvetica Neue", sans-serif;

      font-family: var(--font-stack);

      background-color: #333;
    }

    #app {
      opacity: 1;
      transition: opacity 600ms ease-out;
    }

    #app.loading {
      opacity: 0;
    }
  </style>
</head>

<body>
  <div id="app" class="loading"></div>

  <script>
    // Set initial background color.
    const regexp = /^#(?:[0-9a-fA-F]{3}){1,2}$/
    const hash = window.location.hash;
    if (hash && regexp.test(hash)) {
      document.body.style.backgroundColor = hash;
    } else {
      const stored = localStorage.getItem("latestColor");
      if (stored && regexp.test(hash)) {
        document.body.style.backgroundColor = stored;
      }
    }
  </script>
  <script type="module" src="./src/app.tsx"></script>
</body>

</html>
